services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentiment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentiment}
      POSTGRES_DB: ${POSTGRES_DB:-sentiment}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: sentiment-api:local
    ports:
      - "8000:8000"
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-v1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentiment}:${POSTGRES_PASSWORD:-sentiment}@db:5432/${POSTGRES_DB:-sentiment}
      FAULT_ERROR_RATE: ${FAULT_ERROR_RATE:-0}
      FAULT_LATENCY_MS: ${FAULT_LATENCY_MS:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
